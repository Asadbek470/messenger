<script>
const socket = io();

let myId = null;
let currentRoom = null;

function register() {
  const nickname = document.getElementById("nickname").value;
  socket.emit("register", nickname);
  document.getElementById("login").style.display = "none";
  document.getElementById("main").style.display = "flex";
}

socket.on("yourId", id => myId = id);

socket.on("users", users => {
  const usersDiv = document.getElementById("users");
  usersDiv.innerHTML = "";

  users.forEach(user => {
    if (user.id !== myId) {
      const div = document.createElement("div");
      div.className = "user";
      div.innerText = user.nickname;

      div.onclick = () => {
        const room = [myId, user.id].sort().join("_");
        currentRoom = room;
        socket.emit("startPrivateChat", user.id);
        document.getElementById("chat").innerHTML = "";
      };

      usersDiv.appendChild(div);
    }
  });
});

socket.on("joinRoom", data => {
  currentRoom = data.room;
  socket.emit("joinRoom", data.room);
});

socket.on("privateMessage", msg => {
  if (!currentRoom) return;

  const div = document.createElement("div");
  div.className = "message " + (msg.senderId === myId ? "mine" : "other");
  div.innerText = msg.senderName + ": " + msg.text;

  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop =
    document.getElementById("chat").scrollHeight;
});

function sendMessage() {
  const text = document.getElementById("messageText").value;
  if (!text || !currentRoom) return;

  socket.emit("privateMessage", {
    room: currentRoom,
    text
  });

  document.getElementById("messageText").value = "";
}
</script>
