<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uzbek Messenger</title>

<script src="/socket.io/socket.io.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  padding: 15px;
  text-align: center;
  background: #1e293b;
  font-size: 20px;
  font-weight: bold;
}

#login {
  display: flex;
  flex-direction: column;
  margin: auto;
  gap: 10px;
  width: 250px;
}

input {
  padding: 10px;
  border: none;
  border-radius: 8px;
}

button {
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #3b82f6;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #2563eb;
}

#main {
  display: none;
  flex: 1;
  overflow: hidden;
}

#users {
  background: #1e293b;
  padding: 10px;
  overflow-y: auto;
  height: 40%;
}

.user {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

#chat {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.message {
  margin-bottom: 8px;
}

#messageInput {
  display: flex;
  padding: 10px;
  background: #1e293b;
}

#messageInput input {
  flex: 1;
  margin-right: 5px;
}
</style>
</head>
<body>

<header>Uzbek Messenger 🚀</header>

<div id="login">
  <input id="nickname" placeholder="Введите никнейм">
  <button onclick="register()">Войти</button>
</div>

<div id="main">
  <div id="users"></div>
  <div id="chat"></div>
  <div id="messageInput">
    <input id="messageText" placeholder="Сообщение...">
    <button onclick="sendMessage()">Отправить</button>
  </div>
</div>

<script>
const socket = io();
let myId = null;
let currentChat = null;

function register() {
  const nickname = document.getElementById("nickname").value;
  socket.emit("register", nickname);
  document.getElementById("login").style.display = "none";
  document.getElementById("main").style.display = "flex";
}

socket.on("yourId", (id) => {
  myId = id;
});

socket.on("users", (users) => {
  const usersDiv = document.getElementById("users");
  usersDiv.innerHTML = "<h3>Пользователи:</h3>";

  users.forEach(user => {
    if (user.id !== myId) {
      const div = document.createElement("div");
      div.className = "user";
      div.innerHTML = `
        <span>${user.nickname}</span>
        <button onclick="requestPrivate('${user.id}')">Написать</button>
      `;
      usersDiv.appendChild(div);
    }
  });
});

function requestPrivate(id) {
  socket.emit("privateRequest", id);
}

socket.on("privateRequestReceived", (data) => {
  const accept = confirm(`${data.fromName} хочет начать личный чат. Принять?`);
  socket.emit("privateResponse", {
    fromId: data.fromId,
    accepted: accept
  });
});

socket.on("privateAccepted", (data) => {
  currentChat = data.chatId;
  document.getElementById("chat").innerHTML = 
    `<h3>Личный чат с ${data.with.nickname}</h3>`;
});

socket.on("privateMessage", (msg) => {
  if (msg.chatId === currentChat) {
    const div = document.createElement("div");
    div.className = "message";
    div.innerText = `${msg.sender}: ${msg.text} (${msg.time})`;
    document.getElementById("chat").appendChild(div);
  }
});

function sendMessage() {
  const text = document.getElementById("messageText").value;
  if (!text || !currentChat) return;

  socket.emit("privateMessage", {
    chatId: currentChat,
    text
  });

  document.getElementById("messageText").value = "";
}
</script>

</body>
</html>
