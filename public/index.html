<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uzbek Messenger Local</title>
<style>
body { margin:0; font-family:sans-serif; background:#0f172a; color:white }
.hidden { display:none }
#login, #setup { padding:20px }
#app { height:100vh; display:flex; flex-direction:column }
#chat { flex:1; overflow:auto; padding:10px }
.message { margin:6px 0; padding:8px 12px; border-radius:12px; max-width:70% }
.mine { background:#3b82f6; align-self:flex-end }
.other { background:#334155 }
#inputArea { display:flex; padding:10px; background:#1e293b }
#inputArea input { flex:1; padding:8px }
button { padding:8px }
</style>
</head>
<body>

<div id="setup" class="hidden">
<h2>Создать пароль</h2>
<input type="password" id="newPassword" placeholder="Пароль">
<button onclick="createPassword()">Создать</button>
</div>

<div id="login" class="hidden">
<h2>Введите пароль</h2>
<input type="password" id="loginPassword">
<button onclick="login()">Войти</button>
</div>

<div id="app" class="hidden">
<div id="chat"></div>
<div id="inputArea">
<input id="messageInput">
<button onclick="sendMessage()">➤</button>
<input type="file" id="fileInput" accept="image/*,video/*" onchange="sendFile(event)">
<button onclick="startVoice()">🎤</button>
<button onclick="openSettings()">⚙</button>
</div>
</div>

<script src="storage.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
